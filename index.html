<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyanka Basava Raj — Portfolio</title>
<meta name="description" content="Priyanka Basava Raj — Senior Analytics Consultant. A Netflix-style portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SCREEN 1: INTRO ANIMATION -->
<div class="screen" id="screenIntro" data-state="active">
  <div class="intro-logo">PRIYANKA</div>
</div>

<!-- SCREEN 2: WHO'S WATCHING -->
<div class="screen hidden profile-gate" id="screenProfiles" data-state="offstage">
  <h1>Who's Watching?</h1>
  <div class="profile-grid" id="profileGrid"></div>
</div>

<!-- MAIN BROWSE APP (hidden until a profile is chosen; video plays directly in hero, no separate intro screen) -->
<div id="app" style="display:none;">

  <nav class="nav" id="siteNav">
    <div class="nav-brand">PRIYANKA</div>
    <ul class="nav-links browse-nav-links" id="browseNavLinks">
      <li><a href="#top" data-nav="home">Home</a></li>
      <li><a href="#" data-nav="professional">Professional</a></li>
      <li><a href="#" data-nav="skills">Skills</a></li>
      <li><a href="#" data-nav="projects">Projects</a></li>
      <li><a href="#" data-nav="hireme">Hire Me</a></li>
    </ul>
    <button class="profile-switcher" id="profileSwitcher">
      <img id="navProfileAvatar" src="" alt="">
      <span id="navProfileLabel"></span>
    </button>
  </nav>

  <header class="hero" id="top">
    <div class="hero-media-frame">
      <div class="hero-media" id="heroMedia"></div>
    </div>
    <div class="hero-fade-bottom"></div>
    <div class="hero-content">
      <p class="hero-eyebrow" id="heroTagline"></p>
      <h1 class="hero-title">Priyanka</h1>
      <p class="hero-synopsis" id="heroSynopsis"></p>
      <div class="hero-actions">
        <a href="#row-continue-watching" class="btn btn-primary" id="heroViewProfileBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
          View Profile
        </a>
        <a href="#" class="btn btn-secondary" id="heroHireMeBtn">Hire Me</a>
      </div>
    </div>
  </header>

  <main class="rows" id="rowsContainer"></main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://au.linkedin.com/in/priyanka-basava-raj" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/PriyankaBasavaRaj/Portfolio-Project" target="_blank" rel="noopener">GitHub</a>
      <a href="https://public.tableau.com/app/profile/priyanka.raj5710" target="_blank" rel="noopener">Tableau</a>
      <a href="mailto:priyankabraj123@gmail.com">Email</a>
    </div>
    <p>Built by Priyanka Basava Raj · Not affiliated with Netflix, Inc.</p>
  </footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal"></div>
  </div>

</div>

<script src="js/main.js"></script>
</body>
</html>
